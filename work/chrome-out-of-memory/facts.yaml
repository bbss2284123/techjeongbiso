    source: "https://support.google.com/chrome/answer/6098869?hl=ko"
    checkedAt: "2026-11-26"
    note: "이번 화면에 쓴 한국어 Chrome 버전. 탭 렌더러가 비정상 종료된 '앗, 이런!' 화면, 작업 관리자(Shift+Esc)의 메모리 사용량·작업 종료, 인터넷 사용 기록 삭제 창에서 확인. 공식 도움말 8단계: 사용하지 않는 탭을 닫아 기기 메모리 확보, 6단계: 인터넷 사용 기록 삭제, 5단계: 확장 프로그램 사용 중지."
